<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Meraki Galleria Shop" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Região, para buscas locais -->
    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Itatiba" />

    <!-- Ícones e cor do navegador no celular -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Prévia do link ao compartilhar (WhatsApp, Instagram, Facebook, X). %SITE_URL% é preenchido no build. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Meraki Galleria Shop" />
    <meta property="og:title" content="Meraki Galleria Shop | Tatuagem e barbearia em Itatiba" />

    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meraki Galleria Shop, 3x eleito o melhor estúdio de tatuagem de Itatiba" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

            "@type": "TattooParlor",
            "@id": "%SITE_URL%/#estudio",
            "name": "Meraki Galleria Shop",
            "description": "Estúdio de tatuagem privado, especializado em preto e branco. Atendimento com horário marcado.",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og-image.jpg",
            "logo": "%SITE_URL%/icon-512.png",
            "telephone": "+55 11 95664-7982",
            "potentialAction": { "@type": "ReserveAction", "target": "https://wa.me/5511956647982" },
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "R. Rangel Pestana, 39",
              "addressLocality": "Itatiba",
              "addressRegion": "SP",
              "postalCode": "13250-250",
              "addressCountry": "BR"
            },
            "areaServed": "Itatiba",
            "sameAs": ["https://www.instagram.com/meraki.tattoobr/"],
            "employee": { "@type": "Person", "name": "Matheus Andrade", "jobTitle": "Tatuador" }
          },
          {
            "@type": "HairSalon",

            "address": {
              "@type": "PostalAddress",
              "streetAddress": "R. Rangel Pestana, 39",
              "addressLocality": "Itatiba",
              "addressRegion": "SP",
              "postalCode": "13250-250",
              "addressCountry": "BR"
            },

    <link rel="preconnect" href="https://fonts.googleapis.com" />
